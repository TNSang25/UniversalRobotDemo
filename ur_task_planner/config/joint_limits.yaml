# Joint limits used by MoveIt, they augment/override the limits of the URDF.
#
# The URDF allows two turns per joint, so every pose has many IK solutions and the
# planner may pick one that swings the arm around or that cannot move straight
# down to the table. The limits below only keep the solutions with the arm facing
# the table (shoulder_pan), the upper arm above the table (shoulder_lift), the
# elbow up (elbow) and the wrist on one side (wrist_2). Widen shoulder_pan when
# objects are placed beside or behind the robot.
joint_limits:
  shoulder_pan_joint:
    has_position_limits: true
    min_position: -1.5708
    max_position: 1.5708
    has_acceleration_limits: true
    max_acceleration: 5.0
  shoulder_lift_joint:
    has_position_limits: true
    min_position: -3.1416
    max_position: 0.0
    has_acceleration_limits: true
    max_acceleration: 5.0
  elbow_joint:
    has_position_limits: true
    min_position: -0.2
    max_position: 3.1416
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_1_joint:
    has_position_limits: true
    min_position: -3.1416
    max_position: 3.1416
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_2_joint:
    has_position_limits: true
    min_position: -3.1416
    max_position: 0.2
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_3_joint:
    has_position_limits: true
    min_position: -3.1416
    max_position: 3.1416
    has_acceleration_limits: true
    max_acceleration: 5.0
  finger_joint:
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.5
  right_finger_joint:
    has_velocity_limits: true
    max_velocity: 0.1
    has_acceleration_limits: true
    max_acceleration: 0.5
